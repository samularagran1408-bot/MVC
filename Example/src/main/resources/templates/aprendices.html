<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listado de Aprendices</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <h1 th:text="${titulo}">Título</h1>
    
    <!-- Enlace para ir al formulario de creación -->
    <a th:href="@{/nuevo}">Registrar Nuevo Aprendiz</a>
    <br/><br/>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Correo</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <!-- Recorre la lista de aprendices enviada por el controlador -->
            <tr th:each="aprendiz : ${lista}">
                <td th:text="${aprendiz.id}"></td>
                <td th:text="${aprendiz.nombre}"></td>
                <td th:text="${aprendiz.correo}"></td>
                <td>
                    <!-- Enlace para eliminar un registro específico -->
                    <a th:href="@{/eliminar/{id}(id=${aprendiz.id})}" 
                       onclick="return confirm('¿Estás seguro?')">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
