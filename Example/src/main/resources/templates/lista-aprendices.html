<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Gestión de Aprendices</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 { font-size: 2em; margin-bottom: 10px; }
        .content { padding: 30px; }
        .alert {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
            animation: slideIn 0.5s ease-out;
        }
        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .alert-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        @keyframes slideIn {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .search-bar {
            margin-bottom: 30px;
            display: flex;
            gap: 10px;
        }
        .search-bar input {
            flex: 1;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        .search-bar button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .search-bar button:hover { transform: translateY(-2px); }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }
        table th {
            background: #f8f9fa;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #dee2e6;
        }
        table td {
            padding: 12px;
            border-bottom: 1px solid #dee2e6;
        }
        table tr:hover { background: #f8f9fa; }
        .actions { display: flex; gap: 10px; }
        .btn-edit, .btn-delete {
            padding: 5px 10px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            text-decoration: none;
            font-size: 12px;
            transition: transform 0.2s;
        }
        .btn-edit { background: #28a745; color: white; }
        .btn-delete { background: #dc3545; color: white; }
        .btn-edit:hover, .btn-delete:hover { transform: translateY(-2px); }
        .form-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 5px;
            margin-top: 30px;
        }
        .form-section h2 { margin-bottom: 20px; color: #333; }
        .form-group { margin-bottom: 15px; }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn-submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: transform 0.2s;
        }
        .btn-submit:hover { transform: translateY(-2px); }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 th:text="${titulo}">Sistema de Gestión</h1>
            <p>Administración de Aprendices</p>
        </div>
        
        <div class="content">
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
            
            <div class="search-bar">
                <form action="#" th:action="@{/aprendices/buscar}" method="get" style="display: flex; gap: 10px; width: 100%;">
                    <input type="text" name="texto" placeholder="Buscar por nombre..." th:value="${busqueda}">
                    <button type="submit">🔍 Buscar</button>
                    <a href="/aprendices" style="text-decoration: none;">
                        <button type="button">Limpiar</button>
                    </a>
                </form>
            </div>
            
            <table th:if="${not #lists.isEmpty(aprendices)}">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Correo</th>
                        <th>Fecha Registro</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="aprendiz : ${aprendices}">
                        <td th:text="${aprendiz.id}">1</td>
                        <td th:text="${aprendiz.nombre}">Nombre</td>
                        <td th:text="${aprendiz.correo}">correo@ejemplo.com</td>
                        <td th:text="${#temporals.format(aprendiz.fechaRegistro, 'dd/MM/yyyy HH:mm')}">Fecha</td>
                        <td class="actions">
                            <a th:href="@{/aprendices/editar/{id}(id=${aprendiz.id})}" class="btn-edit">✏️ Editar</a>
                            <a th:href="@{/aprendices/eliminar/{id}(id=${aprendiz.id})}" 
                               class="btn-delete" 
                               onclick="return confirm('¿Estás seguro de eliminar a ' + '${aprendiz.nombre}' + '?')">🗑️ Eliminar</a>
                        </td>
                    </tr>
                </tbody>
            </table>
            
            <div th:if="${#lists.isEmpty(aprendices)}" class="empty-state">
                <p>📭 No hay aprendices registrados</p>
            </div>
            
            <div class="form-section">
                <h2>Registrar Nuevo Aprendiz</h2>
                <form action="#" th:action="@{/aprendices/guardar}" th:object="${nuevoAprendiz}" method="post">
                    <div class="form-group">
                        <label for="nombre">Nombre:</label>
                        <input type="text" th:field="*{nombre}" id="nombre" required/>
                    </div>
                    <div class="form-group">
                        <label for="correo">Correo Electrónico:</label>
                        <input type="email" th:field="*{correo}" id="correo" required/>
                    </div>
                    <button type="submit" class="btn-submit">Guardar Aprendiz</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
