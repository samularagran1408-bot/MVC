<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Aprendiz</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <h1>Registro de Aprendiz</h1>

    <!-- El formulario se mapea al objeto 'aprendiz' y se envía por POST -->
    <form th:action="@{/guardar}" th:object="${aprendiz}" method="post">
        
        <!-- Campo oculto para el ID (necesario si implementas actualizar) -->
        <input type="hidden" th:field="*{id}" />

        <div>
            <label>Nombre:</label>
            <input type="text" th:field="*{nombre}" placeholder="Ingrese el nombre" required />
        </div>
        <br/>
        <div>
            <label>Correo Electrónico:</label>
            <input type="email" th:field="*{correo}" placeholder="ejemplo@correo.com" required />
        </div>
        <br/>
        <button type="submit">Guardar Aprendiz</button>
        <a th:href="@{/aprendices}">Cancelar</a>
    </form>
</body>
</html>
